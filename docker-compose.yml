version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorize}
      POSTGRES_USER: ${POSTGRES_USER:-memorize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorize_pass}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-memorize}:${POSTGRES_PASSWORD:-memorize_pass}@db:5432/${POSTGRES_DB:-memorize}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app:cached

volumes:
  db-data:
